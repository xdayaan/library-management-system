services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms_backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CONNECTION_STRING=Host=db;Port=5432;Database=lms;Username=postgres;Password=your_password
      - JWT_SECRET=your_secret_key_here
    ports:
      - "5000:8080"
      - "5001:443"
    depends_on:
      - db
    networks:
      - lms-network

  db:
    image: postgres:15-alpine
    container_name: lms_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: lms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lms-network

volumes:
  postgres_data:

networks:
  lms-network:
    driver: bridge
